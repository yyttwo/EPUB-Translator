name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - "app/windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/windows/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  x64-build-test:
    name: Windows x64 build and tests
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app/windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore EPUBTranslator.Windows.sln -p:Platform=x64
      - name: Build
        run: dotnet build EPUBTranslator.Windows.sln --no-restore -c Release -p:Platform=x64 -p:PublishReadyToRun=false -p:AppxPackageSigningEnabled=false
      - name: Core tests
        run: dotnet test tests/EPUBTranslator.Core.Tests/EPUBTranslator.Core.Tests.csproj --no-restore -c Release -p:Platform=x64
      - name: Windows tests
        run: dotnet test tests/EPUBTranslator.Windows.Tests/EPUBTranslator.Windows.Tests.csproj --no-restore -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64
      - name: Privacy scan
        shell: pwsh
        run: ./scripts/Test-RepositoryPrivacy.ps1
