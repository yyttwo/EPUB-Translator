name: Bug report
description: Report a reproducible EPUB翻译 problem without sharing private data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交 API Key、私人 EPUB、书籍正文、个人文件路径或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.1 (4)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS version only; omit device name and identifiers"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Qwen
        - DeepSeek
        - Not provider-related
    validations:
      required: true
  - type: dropdown
    id: style
    attributes:
      label: Translation style
      options:
        - 直译版
        - 通畅版
        - 意译（更简洁有力）
        - 书面评论体
        - Not translation-related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a self-authored or public-domain minimal example; do not attach a private book.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostic information
      description: Optional. Review every line and remove credentials, book content, paths, account data, and machine identifiers before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API Keys, private books, personal paths, account identifiers, and sensitive logs/screenshots.
          required: true
