name: 问题报告
description: 在不分享私人数据的前提下报告可复现问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交 API Key、私人 EPUB、书籍正文、个人文件路径或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: "1.0.1 (4)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统版本
      placeholder: "例如 macOS 15 或 Windows 11；请勿填写设备名称和标识符"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: 服务商
      options:
        - Qwen
        - DeepSeek
        - 与服务商无关
    validations:
      required: true
  - type: dropdown
    id: style
    attributes:
      label: 翻译风格
      options:
        - 直译版
        - 通畅版
        - 意译（更简洁有力）
        - 书面评论体
        - 与翻译无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用自制或公共领域的最小示例，不要上传私人书籍。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的诊断信息
      description: 可选。提交前请逐行检查并删除凭据、书籍内容、路径、账户数据和设备标识。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除 API Key、私人书籍、个人路径、账户标识以及敏感日志或截图。
          required: true
